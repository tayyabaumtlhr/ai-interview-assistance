<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>AI Interview Assistant</title>
  <style>
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #f0f2f5; margin: 0; padding: 20px; }
    .chat-container { max-width: 650px; margin: 30px auto; background: #ffffff; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
    h2 { color: #1a73e8; margin-top: 0; text-align: center; }
    .hidden { display: none !important; }
    .input-group { margin-bottom: 15px; }
    label { font-weight: 600; color: #333; display: block; margin-bottom: 5px; }
    input { width: 100%; padding: 12px; border-radius: 6px; border: 1px solid #ccc; box-sizing: border-box; font-size: 14px; }
    button { width: 100%; padding: 12px; background: #1a73e8; color: white; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 15px; }
    button:hover { background: #1557b0; }
    button:disabled { background: #ccc; cursor: not-allowed; }
    .chat-box { border: 1px solid #e0e0e0; height: 400px; overflow-y: auto; padding: 15px; border-radius: 8px; background: #f8f9fa; margin-bottom: 15px; }
    .msg { margin-bottom: 12px; padding: 10px 14px; border-radius: 8px; max-width: 80%; line-height: 1.4; word-wrap: break-word; }
    .user { background: #1a73e8; color: white; margin-left: auto; text-align: right; }
    .bot { background: #e8f0fe; color: #1f1f1f; margin-right: auto; }
  </style>
</head>
<body>

<div class="chat-container">
  <h2>🤖 AI Interview Assistant</h2>

  <!-- Setup Form -->
  <div id="start-form">
    <div class="input-group">
      <label>Job Role:</label>
      <input type="text" id="role" placeholder="e.g. Node.js Developer, React Developer">
    </div>
    <div class="input-group">
      <label>Experience Level:</label>
      <input type="text" id="level" placeholder="e.g. Junior, Mid-Level, Senior">
    </div>
    <button id="start-btn" onclick="startInterview()">Start Practice Session</button>
  </div>

  <!-- Chat Area -->
  <div id="chat-section" class="hidden">
    <div class="chat-box" id="chat-box"></div>
    <div style="display:flex; gap:10px;">
      <input type="text" id="user-input" placeholder="Type your answer here..." onkeypress="handleKeyPress(event)">
      <button onclick="sendAnswer()" id="send-btn" style="width: 120px;">Send</button>
    </div>
  </div>
</div>

<script>
  let chatHistory = [];
  let currentRole = '';
  let currentLevel = '';

  async function startInterview() {
    currentRole = document.getElementById('role').value.trim();
    currentLevel = document.getElementById('level').value.trim();

    if (!currentRole || !currentLevel) {
      alert('Kripya Role aur Level dono fill karein!');
      return;
    }

    const btn = document.getElementById('start-btn');
    btn.disabled = true;
    btn.innerText = 'Generating Question...';

    try {
      const res = await fetch('/interview/start', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ role: currentRole, level: currentLevel })
      });
      const data = await res.json();

      document.getElementById('start-form').classList.add('hidden');
      document.getElementById('chat-section').classList.remove('hidden');

      appendMessage('bot', data.message);
      chatHistory.push({ role: 'assistant', content: data.message });
    } catch (err) {
      alert('Error: Backend connect nahi ho pa raha.');
    } finally {
      btn.disabled = false;
      btn.innerText = 'Start Practice Session';
    }
  }

  async function sendAnswer() {
    const inputEl = document.getElementById('user-input');
    const userMsg = inputEl.value.trim();
    if (!userMsg) return;

    inputEl.value = '';
    appendMessage('user', userMsg);
    chatHistory.push({ role: 'user', content: userMsg });

    const btn = document.getElementById('send-btn');
    btn.disabled = true;

    try {
      const res = await fetch('/interview/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ role: currentRole, level: currentLevel, chatHistory })
      });
      const data = await res.json();

      appendMessage('bot', data.message);
      chatHistory.push({ role: 'assistant', content: data.message });
    } catch (err) {
      alert('Error sending message.');
    } finally {
      btn.disabled = false;
    }
  }

  function handleKeyPress(e) {
    if (e.key === 'Enter') sendAnswer();
  }

  function appendMessage(sender, text) {
    const box = document.getElementById('chat-box');
    const msgDiv = document.createElement('div');
    msgDiv.className = `msg ${sender}`;
    msgDiv.innerText = text;
    box.appendChild(msgDiv);
    box.scrollTop = box.scrollHeight;
  }
</script>

</body>
</html>
