<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>AI Interview Assistant</title>
  <style>
    body { font-family: Arial, sans-serif; background: #f4f7f6; margin: 0; padding: 20px; }
    .container { max-width: 600px; margin: 40px auto; background: white; padding: 25px; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
    h2 { color: #2c3e50; text-align: center; }
    .field { margin-bottom: 15px; }
    label { font-weight: bold; display: block; margin-bottom: 5px; }
    input { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box; }
    button { width: 100%; padding: 12px; background: #3498db; color: white; border: none; border-radius: 5px; cursor: pointer; font-size: 16px; font-weight: bold; }
    button:hover { background: #2980b9; }
    .chat-box { height: 350px; border: 1px solid #ddd; border-radius: 5px; overflow-y: auto; padding: 10px; background: #fafafa; margin-bottom: 15px; }
    .msg { margin: 8px 0; padding: 10px; border-radius: 6px; max-width: 80%; }
    .user { background: #3498db; color: white; margin-left: auto; text-align: right; }
    .bot { background: #eef2f5; color: #333; }
    .hidden { display: none; }
  </style>
</head>
<body>

<div class="container">
  <h2>🤖 AI Interview Assistant</h2>

  <!-- Form -->
  <div id="setup-form">
    <div class="field">
      <label>Job Role:</label>
      <input type="text" id="roleInput" placeholder="e.g. Node.js Developer">
    </div>
    <div class="field">
      <label>Experience Level:</label>
      <input type="text" id="levelInput" placeholder="e.g. Junior, Senior">
    </div>
    <button id="startBtn" onclick="startInterview()">Start Practice Session</button>
  </div>

  <!-- Chat -->
  <div id="chat-section" class="hidden">
    <div class="chat-box" id="chatBox"></div>
    <div style="display: flex; gap: 10px;">
      <input type="text" id="userAnswer" placeholder="Type your answer..." onkeypress="if(event.key==='Enter') sendAnswer()">
      <button onclick="sendAnswer()" id="sendBtn" style="width: 100px;">Send</button>
    </div>
  </div>
</div>

<script>
  let chatHistory = [];
  let role = '';
  let level = '';

  async function startInterview() {
    role = document.getElementById('roleInput').value.trim();
    level = document.getElementById('levelInput').value.trim();

    if(!role || !level) {
      alert('Please fill both Role and Level!');
      return;
    }

    document.getElementById('startBtn').innerText = 'Starting...';

    try {
      const res = await fetch('/interview/start', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ role, level })
      });
      const data = await res.json();

      document.getElementById('setup-form').classList.add('hidden');
      document.getElementById('chat-section').classList.remove('hidden');

      addMsg('bot', data.message);
      chatHistory.push({ role: 'assistant', content: data.message });
    } catch(e) {
      alert('Backend connection error!');
    }
  }

  async function sendAnswer() {
    const input = document.getElementById('userAnswer');
    const txt = input.value.trim();
    if(!txt) return;

    input.value = '';
    addMsg('user', txt);
    chatHistory.push({ role: 'user', content: txt });

    try {
      const res = await fetch('/interview/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ role, level, chatHistory })
      });
      const data = await res.json();
      addMsg('bot', data.message);
      chatHistory.push({ role: 'assistant', content: data.message });
    } catch(e) {
      alert('Error fetching response');
    }
  }

  function addMsg(sender, text) {
    const box = document.getElementById('chatBox');
    const d = document.createElement('div');
    d.className = `msg ${sender}`;
    d.innerText = text;
    box.appendChild(d);
    box.scrollTop = box.scrollHeight;
  }
</script>

</body>
</html>
